name: Deploy Fangcun Sudoku to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify Pages H5 build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build for GitHub Pages subpath
        env:
          GITHUB_PAGES: 'true'
        run: npm run build:h5
      - name: Install browser for matching Pages regression
        run: npx playwright install --with-deps chromium
      - name: Verify Pages layout and interactions
        env:
          PAGES_BUILD: 'true'
        run: |
          node <<'NODE'
          const {spawnSync} = require('node:child_process')
          const result = spawnSync('npm', ['run', 'test:browser'], {
            encoding: 'utf8',
            maxBuffer: 10 * 1024 * 1024,
          })
          process.stdout.write(result.stdout || '')
          process.stderr.write(result.stderr || '')
          if (result.status !== 0) {
            const detail = result.stderr || result.stdout || result.error?.message || 'Browser regression exited without output.'
            const escaped = detail.slice(-6000)
              .replace(/%/g, '%25')
              .replace(/\r/g, '%0D')
              .replace(/\n/g, '%0A')
            process.stdout.write(`\n::error title=Browser regression::${escaped}\n`)
          }
          process.exit(result.status ?? 1)
          NODE
      - name: Save preview for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-pages-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Explain Pages setup requirement
        if: github.event_name != 'pull_request' && github.event.repository.has_pages != true
        run: |
          echo '### GitHub Pages 尚未启用' >> "$GITHUB_STEP_SUMMARY"
          echo '✅ H5 静态构建通过，但未发布网站。' >> "$GITHUB_STEP_SUMMARY"
          echo '请先到 Settings → Pages → Build and deployment 将 Source 设为 GitHub Actions；完成后手动运行本工作流。' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.event.repository.has_pages == true
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: github.event_name != 'pull_request' && github.event.repository.has_pages == true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish website
    if: github.event_name != 'pull_request' && github.event.repository.has_pages == true
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
