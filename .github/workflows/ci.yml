name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build H5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript and gameplay logic
        run: |
          npm run typecheck
          npm test
      - name: Build static H5 site
        run: npm run build:h5
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify responsive layout and interactions
        run: |
          node <<'NODE'
          const {spawnSync} = require('node:child_process')
          const result = spawnSync('npm', ['run', 'test:browser'], {
            encoding: 'utf8',
            maxBuffer: 10 * 1024 * 1024,
          })
          process.stdout.write(result.stdout || '')
          process.stderr.write(result.stderr || '')
          if (result.status !== 0) {
            const detail = result.stderr || result.stdout || result.error?.message || 'Browser regression exited without output.'
            const escaped = detail.slice(-6000)
              .replace(/%/g, '%25')
              .replace(/\r/g, '%0D')
              .replace(/\n/g, '%0A')
            process.stdout.write(`\n::error title=Browser regression::${escaped}\n`)
          }
          process.exit(result.status ?? 1)
          NODE
      - name: Save H5 build for review
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-h5-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
